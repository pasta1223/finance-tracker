<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="542px" preserveAspectRatio="none" style="width:1642px;height:542px;background:#FFFFFF;" version="1.1" viewBox="0 0 1642 542" width="1642px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="372" x="628" y="25.1074">Finance Management Platform - GUI Delivery Context</text><!--entity PersonalUser--><g id="elem_PersonalUser"><ellipse cx="1426" cy="306.1211" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M1426,314.1211 L1426,341.1211 M1413,322.1211 L1439,322.1211 M1426,341.1211 L1413,356.1211 M1426,341.1211 L1439,356.1211 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="89" x="1381.5" y="372.7285">Personal User</text></g><!--entity HouseholdUser--><g id="elem_HouseholdUser"><ellipse cx="80" cy="209.7422" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M80,217.7422 L80,244.7422 M67,225.7422 L93,225.7422 M80,244.7422 L67,259.7422 M80,244.7422 L93,259.7422 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122" x="19" y="276.3496">Household Member</text><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="67" x="46.5" y="197.7285">&#171;planned&#187;</text></g><!--entity BusinessUser--><g id="elem_BusinessUser"><ellipse cx="80" cy="341.7422" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M80,349.7422 L80,376.7422 M67,357.7422 L93,357.7422 M80,376.7422 L67,391.7422 M80,376.7422 L93,391.7422 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="148" x="6" y="408.3496">Company Finance User</text><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="67" x="46.5" y="329.7285">&#171;planned&#187;</text></g><!--entity Desktop--><g id="elem_Desktop"><rect fill="#F1F1F1" height="75.8633" rx="6" ry="6" style="stroke:#181818;stroke-width:0.5;" width="220" x="1316" y="413.1211"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="121" x="1365.5" y="438.2285">&#171;external platform&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="200" x="1326" y="456.8496">Graphical Desktop Environment</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="120" x="1326" y="475.4707">Tkinter + Matplotlib</text></g><!--entity FinanceSystem--><g id="elem_FinanceSystem"><rect fill="#F1F1F1" height="131.7266" rx="6" ry="6" style="stroke:#181818;stroke-width:0.5;" width="213" x="543" y="231.1211"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="60" x="619.5" y="256.2285">&#171;system&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="193" x="553" y="274.8496">Finance Management Platform</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4" x="553" y="293.4707">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161" x="553" y="312.0918">Transaction management</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="164" x="553" y="330.7129">Statistics and visualization</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="137" x="553" y="349.334">Shared financial state</text></g><!--entity Ledger--><g id="elem_Ledger"><path d="M1337,55.6211 C1337,45.6211 1426,45.6211 1426,45.6211 C1426,45.6211 1515,45.6211 1515,55.6211 L1515,139.1055 C1515,149.1055 1426,149.1055 1426,149.1055 C1426,149.1055 1337,149.1055 1337,139.1055 L1337,55.6211 " fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M1337,55.6211 C1337,65.6211 1426,65.6211 1426,65.6211 C1426,65.6211 1515,65.6211 1515,55.6211 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="118" x="1367" y="84.7285">&#171;external storage&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158" x="1347" y="103.3496">Shared SQLite Database</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4" x="1347" y="121.9707">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="150" x="1347" y="140.5918">data/finance_tracker.db</text></g><g id="elem_GMN16"><path d="M444,398.1211 L444,459.9941 A0,0 0 0 0 444,459.9941 L855,459.9941 A0,0 0 0 0 855,459.9941 L855,408.1211 L845,398.1211 L653.5,398.1211 L649.5,363.2711 L645.5,398.1211 L444,398.1211 A0,0 0 0 0 444,398.1211 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M845,398.1211 L845,408.1211 L855,408.1211 L845,398.1211 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333" x="450" y="417.1494">The packaged product exposes a graphical interface only.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="318" x="450" y="434.4404">Personal finance is implemented in the current release.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="390" x="450" y="451.7314">Household and company-finance interfaces are planned extensions.</text></g><g id="elem_GMN19"><path d="M1217,183.6211 L1217,262.7852 A0,0 0 0 0 1217,262.7852 L1635,262.7852 A0,0 0 0 0 1635,262.7852 L1635,193.6211 L1625,183.6211 L1430,183.6211 L1426,148.9411 L1422,183.6211 L1217,183.6211 A0,0 0 0 0 1217,183.6211 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1625,183.6211 L1625,193.6211 L1635,193.6211 L1625,183.6211 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397" x="1223" y="202.6494">The packaged GUI uses the SQLite database beside the executable.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="350" x="1223" y="219.9404">SQLite is embedded and does not require a database server.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362" x="1223" y="237.2314">The current system has no cloud synchronization, remote API,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181" x="1223" y="254.5225">or third-party payment platform.</text></g><!--link PersonalUser to FinanceSystem--><g id="link_PersonalUser_FinanceSystem"><path d="M1381.49,339.8011 C1289.59,344.8911 1069,354.0811 885,338.1211 C842.59,334.4411 802.2484,328.1905 762.1184,320.7105 " fill="none" id="PersonalUser-to-FinanceSystem" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="756.22,319.6111,764.3347,325.1925,761.1353,320.5273,765.8006,317.328,756.22,319.6111" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300" x="886" y="317.1494">Packaged GUI: add, query, and delete transactions;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235" x="918.5" y="334.4404">undo/redo; view statistics and dashboard</text></g><!--link FinanceSystem to PersonalUser--><g id="link_FinanceSystem_PersonalUser"><path d="M756.07,292.3311 C864.42,288.5811 1037.78,285.8411 1187,298.1211 C1255.44,303.7511 1327.9794,316.9899 1375.5194,326.6199 " fill="none" id="FinanceSystem-to-PersonalUser" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1381.4,327.8111,1373.3733,322.1039,1376.4995,326.8184,1371.785,329.9447,1381.4,327.8111" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215" x="928.5" y="269.1494">Transaction lists, summaries, charts,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121" x="975.5" y="286.4404">and operation results</text></g><!--link HouseholdUser to FinanceSystem--><g id="link_HouseholdUser_FinanceSystem"><path d="M141.2,238.1211 C236.76,249.2411 418.4902,270.3677 536.8402,284.1377 " fill="none" id="HouseholdUser-to-FinanceSystem" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="542.8,284.8311,534.3226,279.8178,537.8335,284.2532,533.398,287.7642,542.8,284.8311" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189" x="204.5" y="240.1494">Future household GUI &#171;planned&#187;</text></g><!--link BusinessUser to FinanceSystem--><g id="link_BusinessUser_FinanceSystem"><path d="M154.03,354.6311 C252.82,343.1411 423.7202,323.2642 536.9702,310.0942 " fill="none" id="BusinessUser-to-FinanceSystem" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="542.93,309.4011,533.5282,306.4675,537.9635,309.9787,534.4523,314.4139,542.93,309.4011" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-famil